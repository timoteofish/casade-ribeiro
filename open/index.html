<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Ribeiro</title>
    <link rel="icon" href="./assets/logo-website.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="splash" aria-label="Casa de Ribeiro">
      <div class="logo-frame">
        <img
          class="logo"
          src="./assets/logo-website.webp"
          alt="Casa de Ribeiro"
        />
      </div>
      <div
        class="loader"
        role="status"
        aria-label="Carregando"
      ></div>
      <small class="version">v1.0</small>
    </main>
    <div class="page-shutter" aria-hidden="true">
      <span class="page-shutter__panel page-shutter__panel--left"></span>
      <span class="page-shutter__panel page-shutter__panel--right"></span>
    </div>
  </body>
</html>
